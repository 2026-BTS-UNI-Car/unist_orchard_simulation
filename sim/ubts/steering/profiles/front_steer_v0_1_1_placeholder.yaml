  front_bumper_x_in_base_m: {value: 0.61, range: [0.50, 0.75], unit: "m", provenance: SPEC_PENDING, identify: [B1], stale_after_mod: true,
    note: "값은 절단 전 표기. 정지 위치 e(앞범퍼 s - s_E)의 정의는 사전등록 정의다"}
  ground_clearance_m: {value: 0.10, range: [0.05, 0.20], unit: "m", provenance: SPEC_PENDING, identify: [B1], stale_after_mod: false}
  steer_type: {value: "linkage", range: {choices: ["linkage", "axle_pivot"]}, unit: "-", provenance: SPEC_PENDING,
