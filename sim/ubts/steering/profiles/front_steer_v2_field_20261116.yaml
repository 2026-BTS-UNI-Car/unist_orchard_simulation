    source: 'Q11 (추정) measurement_serial.log 의 PWM 100 700 ms 펄스: 출력을 끄자 10 ms 안에 멈춘다(관성 주행이 거의 없음). 1차 지연을 짧게 둔 맞춤 값'
  steer_min_pwm_pct:
    value: 10.0
    range: [10.0, 50.0]
    unit: '%'
    provenance: SIM_ASSUMED
    identify: [B4]
    stale_after_mod: false
    note: '주행 중 조향 모터가 움직이기 시작하는 PWM(이 값을 넘어야 움직인다). steer_min_pwm_standstill_pct 이하여야 한다(읽기에서 검사). 35 위로 스윕할 때는 정지 중 값도 함께
      올린다 | 사양 반영: Q11 자리값'
    source: Q11 (자리값) 움직이기 시작하는 PWM 은 재지 않았다(PWM 100 은 움직인다). 맞춤에 쓴 가정
  steer_min_pwm_standstill_pct:
