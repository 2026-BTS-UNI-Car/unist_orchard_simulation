      - {pot: 2009, seen: about_1_deg_or_less_right, approached_from: right}
      - {pot: 2006, seen: straight, approached_from: left}
      - {pot: 2029, seen: straight, approached_from: left}
    provenance: USER_VISUAL
    source: 사용자 눈 확인(22:45 "지금이 정 중앙은 아니야. 오른쪽으로 조금 틀어져있는 상태임" at 1913, 22:40~22:50 의 가운데 확인). 가변저항이 클수록 바퀴가
      왼쪽 -> 펌웨어 부호 POT_DECREASES(오른쪽으로 갈수록 준다)와 같다. 또 r5 계단의 모든 ANGLE 이 한 번의 구동으로 목표에 닿아 모터 방향과 가변저항 방향이
