    note: '설계 3.3 L1의 ''정지 중 최소 PWM 증가'' 자리값. (새 자리값) 설계 표에 숫자가 없어 새로 둔 값. 주행 중 값 이상 | 사양 반영: Q11 자리값'
    source: Q11 (자리값) 주행 중 값과 같게 둔 가정(시험이 서 있는 차에서였고 주행 중 값은 모른다)
