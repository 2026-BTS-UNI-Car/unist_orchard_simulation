    identify: [B1]
    stale_after_mod: true
    note: '절단 전 제품 표기. 조향 장치 돌출을 포함해 실측으로 바꾼다. (새 자리값) 범위는 임시로 정했다(설계: 실측으로 교체)'
  footprint_width_m:
    value: 0.7
    range: [0.6, 0.85]
    unit: m
    provenance: SPEC_PENDING
    identify: [B1]
    stale_after_mod: true
    note: '절단 전 제품 표기. (새 자리값) 범위는 임시로 정했다(설계: 실측으로 교체)'
  front_bumper_x_in_base_m:
    value: 0.61
    range: [0.5, 0.75]
    unit: m
    provenance: SPEC_PENDING
    identify: [B1]
    stale_after_mod: true
    note: 값은 절단 전 표기. 정지 위치 e(앞범퍼 s - s_E)의 정의는 사전등록 정의다
  ground_clearance_m:
    value: 0.1
    range: [0.05, 0.2]
