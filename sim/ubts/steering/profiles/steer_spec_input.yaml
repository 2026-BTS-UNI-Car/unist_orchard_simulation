# 조향 장치 사양 입력 파일 (사양이 오면 이 파일 하나만 고친다)
#
# 쓰는 법: docs/steering/SPEC_UPDATE_KO.md
#   1) 받은 답·잰 값을 아래 칸의 value에 적는다. 모르는 칸은 null로 둔다(바탕 프로필 값이 그대로 남는다).
#   2) source: 사용자(사용자 설명·어림값) / 측정(실측, date 필수) / 제품표기(라벨·판매 페이지).
#      date: 측정한 날 YYYYMMDD. note: 어떻게 얻었는지 한 줄(측정은 note가 출처로 들어간다).
#   3) 명령(sim/ubts에서):
#        python -B ../../tools/steer_sim/apply_spec.py --spec steering/profiles/steer_spec_input.yaml --out <저장소 밖 폴더>
#      범위 검사 -> 새 프로필 후보 -> 계산값·펌웨어 상수·Gazebo 값 -> 바뀐 값 요약 -> 짧은 확인. --install이면
#      profiles/<new_profile_id>.yaml로 넣는다(그 파일을 커밋한다).
#
# 칸 이름은 사양 요청서(VEHICLE_SPEC_REQUEST_KO.md)의 질문 번호(q)와 프로필 매개변수 이름이다.
# "입력 전용" 칸(belt_pulley_teeth_steer, pot_adc_end_raws, pot_turn_deg_end_to_end)은 도구가 프로필 값으로 바꾼다.
# 이 파일은 저장소에 빈 판(모든 value null)으로 둔다. 실제 값을 넣은 판은 같은 이름으로 커밋해도 되고,
# 새 프로필 파일과 보고서가 그 내용을 다시 담는다.
schema: ubts.steer_spec_input.v1
base_profile: front_steer_v0_3_placeholder     # 바탕 프로필(profiles/ 안 이름). v0.3 = v0.2 값
new_profile_id: null                           # null이면 front_steer_v1_spec_<가장 늦은 측정일 또는 오늘>
description: null
fields:
  # ---- Q2 / Q10 / B1 차체·조향 기하
  wheelbase_m:              {q: Q2,  value: null, source: null, date: null, note: null}   # 뒤차축-앞차축(m)
  track_front_m:            {q: Q2,  value: null, source: null, date: null, note: null}   # 앞 윤거(m)
  track_rear_m:             {q: Q2,  value: null, source: null, date: null, note: null}
  kingpin_width_m:          {q: Q2,  value: null, source: null, date: null, note: null}   # 두 킹핀 축 사이(m)
  wheel_radius_front_m:     {q: Q2,  value: null, source: null, date: null, note: null}
  wheel_radius_rear_m:      {q: Q2,  value: null, source: null, date: null, note: null}
  steer_type:               {q: Q10, value: null, source: null, date: null, note: null}   # linkage / axle_pivot
  steer_mech_limit_deg:     {q: Q2,  value: null, source: null, date: null, note: null}   # 숫자 하나(네 방향 같음) 또는 {left_wheel_toward_left: .., ...}
  steer_ackermann_ratio:    {q: Q2,  value: null, source: null, date: null, note: null}   # 0 평행 ~ 1 Ackermann(B3)
  steer_backlash_deg:       {q: Q10, value: null, source: null, date: null, note: null}   # 링크 유격(B6)
  footprint_length_m:       {q: Q2,  value: null, source: null, date: null, note: null}   # 조향 장치 돌출 포함(B1)
  footprint_width_m:        {q: Q2,  value: null, source: null, date: null, note: null}
  mass_kg:                  {q: Q2,  value: null, source: null, date: null, note: null}
  # ---- Q11 / Q26 조향 모터·드라이버·급전
  steer_self_locking:       {q: Q11, value: null, source: null, date: null, note: null}   # 웜기어 등 자기 잠금이면 true
  steer_motor_stall_torque_nm: {q: Q11, value: null, source: null, date: null, note: null}   # 조향축 기준 정지 토크
  steer_motor_stall_current_a: {q: Q11, value: null, source: null, date: null, note: null}
  steer_gear_ratio:         {q: Q11, value: null, source: null, date: null, note: null}
  steer_rate_max_deg_s:     {q: Q11, value: null, source: null, date: null, note: null}   # 주행 중 조향 속도(B5)
  steer_rate_standstill_deg_s: {q: Q11, value: null, source: null, date: null, note: null}  # 서 있을 때(F5)
  steer_min_pwm_pct:        {q: Q11, value: null, source: null, date: null, note: null}   # 움직이기 시작하는 PWM(B4, 주행 중)
  steer_min_pwm_standstill_pct: {q: Q11, value: null, source: null, date: null, note: null}
  steer_supply_shared_with_drive: {q: Q26, value: null, source: null, date: null, note: null}  # 구동 배터리 공유면 true
  # ---- Q22~Q25 벨트·가변저항·리밋
  belt_type:                {q: Q22, value: null, source: null, date: null, note: null}   # timing / flat / round
  belt_pulley_teeth_pot:    {q: Q22, value: null, source: null, date: null, note: null}   # 가변저항 쪽 잇수
  belt_pulley_teeth_steer:  {q: Q22, value: null, source: null, date: null, note: null}   # 입력 전용: 조향 쪽 잇수 -> 벨트 비
  belt_pot_play_deg:        {q: Q23, value: null, source: null, date: null, note: null}   # 측정 쪽 유격(조향 눈금 deg)
  pot_location:             {q: Q23, value: null, source: null, date: null, note: null}   # motor(링크 유격 앞) / wheel(뒤)
  pot_range_deg:            {q: Q23, value: null, source: null, date: null, note: null}   # 가변저항 전기 회전 범위
  pot_to_steer_ratio:       {q: Q22, value: null, source: null, date: null, note: null}   # 벨트 비(직접 줄 때)
  pot_adc_end_raws:         {q: Q24, value: null, source: null, date: null, note: null}   # 입력 전용: [왼쪽 끝, 가운데, 오른쪽 끝] ADC
  pot_turn_deg_end_to_end:  {q: Q24, value: null, source: null, date: null, note: null}   # 입력 전용: 끝에서 끝까지 가변저항 회전각
  steer_limit_switch:       {q: Q25, value: null, source: null, date: null, note: null}   # none / both(both는 아직 모형 없음)
