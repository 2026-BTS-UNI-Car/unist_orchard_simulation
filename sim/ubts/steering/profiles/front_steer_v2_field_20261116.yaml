    identify: [B1]
    note: (윤거 - 킹핀 폭)/2 - 바퀴 반경 x tan(킹핀 경사). linkage 형식에서만 뜻이 있다. 자리값에서 0.05. 범위는 입력 범위 전체가 주는 -0.084~0.125를 덮는다(설계 표 0~0.10은
      킹핀 폭 0.58~0.60 m를 막아서 넓혔다. 음수는 킹핀 축이 바퀴 중심보다 바깥)
  steer_hardware_margin_m:
    value: 0.02
    range: [0.0, 0.1]
    unit: m
    provenance: SPEC_PENDING
    identify: [B1]
    stale_after_mod: false
    note: '브래킷 등 미지 돌출(설계 3.2: 스윕 + 이 값). 앞바퀴가 차체 반폭 밖으로 나온 만큼(이 값까지) 바퀴 바깥쪽으로만 더한다. 직진처럼 바퀴가 차체 안이면 0이라 발자국은 차체와 같다(설계 7.1)'
  steer_sweep_m:
    unit: m
    provenance: DERIVED
    derived_from: [wheel_radius_front_m, wheel_width_m, kingpin_width_m, track_front_m, steer_mech_limit_deg, footprint_width_m,
      steer_type]
    identify: [B1]
    note: 바퀴가 기계 한계에 있을 때 앞바퀴 모서리가 차체 반폭 밖으로 나오는 거리(브래킷 여유 제외). 자리값 28도에서 약 0.043
  mass_kg:
    value: 24.0
    range: [20.0, 60.0]
    unit: kg
    provenance: SIM_ASSUMED
    identify: [B1]
    stale_after_mod: false
    note: 차체 질량(바퀴 제외). 축별 체중계로 잰다
  cog_x_in_base_m:
    value: 0.0
    range: [-0.2, 0.2]
    unit: m
