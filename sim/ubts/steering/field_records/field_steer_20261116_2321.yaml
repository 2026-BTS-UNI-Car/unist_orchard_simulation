# 현장 조향 측정 기록 field_steer_20261116_2321 (차량 ESP32-S3 보드, 2026-11-16 밤, SMOOTH 펌웨어 r5)
# 앞바퀴를 땅에서 띄운 채(차체 받침), 조향만, 구동 0 에서 잰 값이다. 주행 결과가 아니고 땅에 닿은 조향의 값도 아니다.
# 이 파일은 버전 파일이다. 고치지 않는다. 앞 기록 field_steer_20261116_2212 를 대신한다(그 파일은 그대로 둔다).
# 시각은 직렬 기록의 시각(Jetson·PC 시계, KST)이다: 끝 찾기 22:38, 가운데 눈 확인 22:40~22:50, CAL SET·CAL SAVE 22:52(펌웨어 r2),
# r5 쓰기와 r5 계단 응답 23:21, SM SMOOTH 저장 23:22. measured_at 은 r5 계단 응답의 시각이다.
# 출처 태그: MEASURED_<YYYYMMDD>_LIFTED 바퀴 든 정지 상태의 현장 측정, FIRMWARE 펌웨어 소스·STATUS 줄, FIRMWARE_NVS 보드 NVS 에 저장된 값,
# USER_VISUAL 사용자가 눈으로 확인, ESTIMATED 근거에서 추정, USER_DECISION 사용자 결정, DEFINITION 정의(계산 규칙), NOT_MEASURED 아직 하지 않음.
