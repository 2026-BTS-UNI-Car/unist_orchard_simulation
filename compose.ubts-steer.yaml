# Steering G-SIM stack (design 8.3 P6a, docs/steering/P6A_HEADLESS_KO.md). Project ubts-steer, ROS domain 43,
# GZ partition ubts-steer, dashboard on 127.0.0.1:18090 (the old SIM stack uses 42 / ubts-sim / 18080, the vehicle 0;
# the dashboard runs in the sim network namespace and the sim service publishes its port).
# Default image ubts-steer-sim:wf9 (2026-11-14, stage 6: the executor container lighter on a busy host - input
# diagnostics opt-in, the SIM clock loop woken by the /clock sample, no parameter services or /rosout on its node, a
# CPU weight above the other services; dashboard copy a92cfec as in wf6).
# wf8 (2026-11-14, stage 5: the executor container's input diagnostics, the follow check
# waits for a quiet DDS graph before Start, operator contract revision 5 - the session is released at a run's end and
# a heartbeat-only session does not refuse another's go; dashboard copy a92cfec as in wf6).
# wf7 (2026-11-13, stage 4: the executor timing work of main b00b666 - a fresh steering
# status before a tick that a long scan processing delayed, gc.freeze before the loop; dashboard copy a92cfec as in
# wf6). wf6 (2026-11-13, stage 3 of the final check: operator link timeout 1.0 s, start check
# 0.08 m/s, the IMU game rotation vector, the dashboard copy a92cfec; the SIM clock mode is chosen by UBTS_STEER_CLOCK,
# the local tool sim_stack.py starts with sim). wf5 (2026-11-13): the one-press executor, the dashboard copy of the
# dashboard repository with the SIM extension, the steering sidecar in the recorder role, the SIM LiDAR bridge's
# profile=mapping scans; wf4c (2026-11-12) had the executor package, the S2 format node and the
# row-following controller; from wf4a on the S2 node is in the image, so "up" publishes /scan in the real-rover format;
# ubts-steer-sim:p6a had /sim/scan only). UBTS_STEER_IMAGE picks another image.
# Never start together with the ubts-sim stack or the fullsensor stack. Reserve 6 GiB with docker_budget.py first:
#   python -I <tools>/docker_budget.py acquire --label p6a-stack --gib 6
#   docker compose -p ubts-steer -f compose.ubts-steer.yaml up -d        (UBTS_STEER_SCENE=w0_force|w1_force|field1010;
#     field1010 needs UBTS_STEER_FIELD_SPEC = a field world spec as JSON text, and for a catalogue corridor the maps and
#     the catalogue of UBTS_STEER_PATHS mounted read-only into the sim service by an override file)
#   docker compose -p ubts-steer -f compose.ubts-steer.yaml run --rm --no-deps check python3 -B -m steering.verify_steer ...
#     (--no-deps and the same UBTS_STEER_* values as at "up": otherwise compose may recreate the sim service, and the
#     steer / recorder / check containers that share its network lose the ROS graph)
#   docker compose -p ubts-steer -f compose.ubts-steer.yaml down -t 20   (no -v: the ubts-steer_* volumes stay; the
#     sim supervisor needs about 6.5 s to stop its children, so every service has stop_grace_period 20 s and the
#     stop / down commands get -t 20)
#   python -I <tools>/docker_budget.py release --label p6a-stack
# Memory (6 GiB budget, design 8.3 P6a): sim 3.5 + dashboard 1 + steer (emulator, bridge) 0.5 + recorder 0.5 +
# executor 0.5 = 6.0. CPU (2026-11-13, docs/steering/STACK_OPERATIONS_KO.md 8): sim 4 + steer 3 + recorder 1 +
# dashboard 1 + executor 3 = 12 of the 22 logical CPUs of the development PC; steer and executor were 1.5 and were
# throttled in the SIM clock mode (CFS: 858 of 5091 periods). The executor service (WF-4, profile executor) is not
# started by a plain "up":
#   docker compose -p ubts-steer -f compose.ubts-steer.yaml --profile executor up -d          (the whole stack, 6.0)
# The check service (profile check, 0.5) takes a slot of its own: with the executor running, start the stack without
# the dashboard (sim + steer + recorder + executor 5.0, + check 0.5):
#   docker compose -p ubts-steer -f compose.ubts-steer.yaml --profile executor up -d sim steer recorder executor
#   docker compose -p ubts-steer -f compose.ubts-steer.yaml --profile executor run --rm --no-deps check \
#     python3 -B -m steering.exec_checks <check> --out /runs/<folder>
# The S2 format node (steering.s2_format_node) runs in the sim service by default (UBTS_STEER_S2_NODE=none: none, the
# P6a stack without /scan). The executor image needs tools/row_executor at /opt/ubts/tools/row_executor (the
# Dockerfile copies it from WF-4 on; with an older image an override file mounts it). docs/steering/S2_NODE_EXEC_KO.md.
# The recorder service also runs the steering sidecar (steering.steering_sidecar: a steering timeline and a separate
# bag next to every recording; UBTS_STEER_SIDECAR=none: the recorder alone). docs/steering/STEER_RECORDING_KO.md.
# Camera: D3D12 / Ogre 1 on the WSLg GPU (as compose.ubts.gpu.yaml); LiDAR: the Embree CPU process. For software
# rendering set UBTS_RENDER_ENGINE=ogre2 UBTS_HEADLESS_RENDERING=1 UBTS_LIBGL_SOFTWARE=1 UBTS_EGL_PLATFORM=surfaceless
# UBTS_GALLIUM_DRIVER=llvmpipe. Placeholder-based SIM results only (자리값 기반 SIM 결과), never field validation.
name: ubts-steer
x-environment: &environment
  ROS_DOMAIN_ID: "43"
  ROS_AUTOMATIC_DISCOVERY_RANGE: LOCALHOST
  ROS_STATIC_PEERS: 127.0.0.1
  FASTRTPS_DEFAULT_PROFILES_FILE: /opt/ubts/sim/ubts/fastdds.xml
  GZ_PARTITION: ubts-steer
  DASHBOARD_MODE: simulation
  ROVER_CONTROL_SOCKET: /run/ubts-steer/control.sock
  UBTS_STEER_HOOK_SOCKET: /run/ubts-steer-emu/hooks.sock
  TELEMETRY_FILE: /runtime/telemetry_snapshot.json
  CAMERA_SETTINGS_FILE: /runtime/camera_settings.json
  LIDAR_BRIDGE_STATUS_FILE: /runtime/lidar_bridge_status.json
  CAMERA_BRIDGE_STATUS_FILE: /runtime/camera_bridge_status.json
  CAMERA_DRIVER_STATUS_FILE: /runtime/camera_driver_status.json
  IMU_BRIDGE_STATUS_FILE: /runtime/imu_bridge_status.json
  IMU_DRIVER_STATUS_FILE: /runtime/imu_driver_status.json
  GPS_BRIDGE_STATUS_FILE: /runtime/gps_bridge_status.json
  ROVER_BRIDGE_STATUS_FILE: /runtime/rover_bridge_status.json
  FAN_HOLD_INTERVAL_S: "0"
  NETWORK_CONTROL_ENABLED: "0"
  RECORDING_ARCHIVE_DIR: /runtime/recordings
  DATA_RECORDER_STATUS_FILE: /runtime/data_recorder_status.json
  RECORDER_API_URL: http://sim:8790
  CAMERA_PREVIEW_LOCAL_FPS: "30"
  SIM_MAPPING_STATE_DIR: /runtime/steer/dashboard/mapping
  SIM_MAP_HISTORY_DIR: /runtime/steer/dashboard/map-history
  PYTHONDONTWRITEBYTECODE: "1"
  UBTS_STEER_SCENE: ${UBTS_STEER_SCENE:-w0_force}
  UBTS_STEER_CLOCK: ${UBTS_STEER_CLOCK:-wall}
  UBTS_STEER_SEED: ${UBTS_STEER_SEED:-0}
  UBTS_STEER_NO_CAMERA: ${UBTS_STEER_NO_CAMERA:-0}
  UBTS_STEER_REPORT_ADC: ${UBTS_STEER_REPORT_ADC:-0}
  UBTS_STEER_LEAD_STEPS: ${UBTS_STEER_LEAD_STEPS:-1}
  UBTS_STEER_PORT_OPEN_RESET: ${UBTS_STEER_PORT_OPEN_RESET:-1}
  UBTS_STEER_S2_NODE: ${UBTS_STEER_S2_NODE:-}
  UBTS_STEER_SIDECAR: ${UBTS_STEER_SIDECAR:-}
  UBTS_STEER_CLIP_NODE: ${UBTS_STEER_CLIP_NODE:-}
  UBTS_STEER_FIELD_SPEC: ${UBTS_STEER_FIELD_SPEC:-}
  UBTS_STEER_SOURCE_COMMIT: ${UBTS_STEER_SOURCE_COMMIT:-unknown}
  UBTS_STEER_SOURCE_STATUS_SHA256: ${UBTS_STEER_SOURCE_STATUS_SHA256:-unknown}
services:
  sim:
    image: ${UBTS_STEER_IMAGE:-ubts-steer-sim:wf9}
    init: true
    ipc: shareable
    shm_size: 512mb
    working_dir: /opt/ubts/sim/ubts
    command: ["python3", "-B", "-m", "steering.supervisor_steer", "--role", "sim"]
    # The dashboard joins this network namespace (it calls the executor's operator page on 127.0.0.1:8097), so its
    # port is published here.
    ports:
      - "127.0.0.1:18090:8080"
    environment:
      <<: *environment
      UBTS_RENDER_ENGINE: ${UBTS_RENDER_ENGINE:-ogre}
      UBTS_HEADLESS_RENDERING: ${UBTS_HEADLESS_RENDERING:-0}
      UBTS_LIDAR_BACKEND: embree
      LIBGL_ALWAYS_SOFTWARE: ${UBTS_LIBGL_SOFTWARE:-0}
      GALLIUM_DRIVER: ${UBTS_GALLIUM_DRIVER:-d3d12}
      MESA_D3D12_DEFAULT_ADAPTER_NAME: ${UBTS_GPU_ADAPTER:-Intel}
      DISPLAY: ":0"
      EGL_PLATFORM: ${UBTS_EGL_PLATFORM:-x11}
      LD_LIBRARY_PATH: /usr/lib/wsl/lib
    devices:
      - /dev/dxg:/dev/dxg
    volumes:
      - runtime:/runtime
      - cache:/root/.gz
      - type: bind
        source: ${UBTS_WSL_LIB:-/usr/lib/wsl/lib}
        target: /usr/lib/wsl/lib
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${UBTS_WSL_DRIVERS:-/usr/lib/wsl/drivers}
        target: /usr/lib/wsl/drivers
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${UBTS_WSLG_SOCKET:-/mnt/host/wslg/.X11-unix}
        target: /tmp/.X11-unix
        read_only: true
        bind:
          create_host_path: false
    mem_limit: 3584m
    cpus: 4
    stop_grace_period: 20s
    restart: "no"
    healthcheck:
      test: ["CMD", "python3", "/opt/ubts/sim/ubts/health.py"]
      interval: 10s
      timeout: 5s
      start_period: 240s
      retries: 6
  steer:
    image: ${UBTS_STEER_IMAGE:-ubts-steer-sim:wf9}
    init: true
    network_mode: "service:sim"
    ipc: "service:sim"
    depends_on:
      sim:
        condition: service_started
    working_dir: /opt/ubts/sim/ubts
    command: ["python3", "-B", "-m", "steering.supervisor_steer", "--role", "steer"]
    environment:
      <<: *environment
    volumes:
      - runtime:/runtime
      - control:/run/ubts-steer
      - hooks:/run/ubts-steer-emu
    mem_limit: 512m
    cpus: 3                 # was 1.5 (throttled in the SIM clock mode; STACK_OPERATIONS_KO.md 8)
    stop_grace_period: 20s
    restart: "no"
  recorder:
    image: ${UBTS_STEER_IMAGE:-ubts-steer-sim:wf9}
    init: true
    network_mode: "service:sim"
    ipc: "service:sim"
    depends_on:
      sim:
        condition: service_started
    working_dir: /opt/ubts/dashboard
    command: ["python3", "-B", "-m", "steering.supervisor_steer", "--role", "recorder"]
    environment:
      <<: *environment
    volumes:
      - runtime:/runtime
    mem_limit: 512m
    cpus: 1
    stop_grace_period: 20s
    restart: "no"
  # Dashboard (docs/steering/SIM_DASHBOARD_KO.md): dashboard/ is the dashboard repository's server and page at the
  # commit of dashboard/DASHBOARD_SOURCE.json (tools/steer_sim/sync_dashboard.py); the simulation additions come from
  # dashboard_sim/ through the dashboard's extension points (provider, extension routes, extra static folder). Front
  # steering screen (DASHBOARD_VEHICLE=front_steer): manual steering through the bridge's control socket, one-press
  # autonomy through the executor relay /api/executor/* -> the executor's operator page on 127.0.0.1:8097 (this
  # container is in the sim network namespace like the executor; the token is the executor's operator_token.txt in the
  # control volume and never reaches the page). The page port 8080 is published by the sim service (127.0.0.1:18090).
  # An image built before the sync (wf4c and earlier) still runs its own older dashboard: it ignores these settings.
  dashboard:
    image: ${UBTS_STEER_IMAGE:-ubts-steer-sim:wf9}
    init: true
    network_mode: "service:sim"
    working_dir: /opt/ubts/dashboard
    command: ["python3", "-B", "-m", "dashboard_server"]
    depends_on:
      sim:
        condition: service_started
    environment:
      <<: *environment
      DASHBOARD_HOST: 0.0.0.0
      DASHBOARD_PORT: "8080"
      DASHBOARD_VEHICLE: front_steer
      DASHBOARD_PROVIDER: ubts_sim_dashboard.provider:SimulationProvider
      DASHBOARD_EXTENSION: ubts_sim_dashboard.extension
      DASHBOARD_EXTRA_STATIC: /opt/ubts/dashboard_sim/static
      PYTHONPATH: /opt/ubts/raydeps:/opt/ubts/dashboard:/opt/ubts/dashboard_sim:/opt/ubts/sim/ubts
      UBTS_EXECUTOR_URL: http://127.0.0.1:8097
      UBTS_EXECUTOR_TOKEN_FILE: /run/ubts-steer/exec/log/operator_token.txt
      UBTS_EXECUTOR_TUNING_LOG: /runtime/steer/dashboard/executor_tuning_log.jsonl
      LIDAR_WS_UPSTREAM: ws://127.0.0.1:8765/ws/lidar
      CAMERA_WS_UPSTREAM: ws://127.0.0.1:8770/ws/camera
      IMU_WS_UPSTREAM: ws://127.0.0.1:8775/ws/imu
      GPS_WS_UPSTREAM: ws://127.0.0.1:8778/ws/gps
    volumes:
      - runtime:/runtime
      - control:/run/ubts-steer
    mem_limit: 1g
    cpus: 1
    stop_grace_period: 20s
    restart: "no"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/api/health',timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 3
  # Executor container (WF-4; design 2.5, 8.3 P6a; steering.exec_container_main): the row executor of
  # tools/row_executor with a SIM scripted controller in its controller slot (the row controller is P8), MOTOR mode,
  # the operator page on 127.0.0.1:8097 inside the sim network namespace, files (config, status, JSONL log, operator
  # token, SIM fault hooks) in /run/ubts-steer/exec. It joins the sim network and IPC (ROS domain 43, FastDDS shared
  # memory) and mounts the control volume only: no runtime volume (SIM status files) and no emulator hooks. Clock
  # mode = UBTS_STEER_CLOCK (wall | sim, the same value as the bridge wrapper). Profile executor (not started by "up").
  executor:
    image: ${UBTS_STEER_IMAGE:-ubts-steer-sim:wf9}
    profiles: ["executor"]
    init: true
    network_mode: "service:sim"
    ipc: "service:sim"
    depends_on:
      steer:
        condition: service_started
    working_dir: /opt/ubts/sim/ubts
    command: ["python3", "-B", "-m", "steering.exec_container_main"]
    environment:
      ROS_DOMAIN_ID: "43"
      ROS_AUTOMATIC_DISCOVERY_RANGE: LOCALHOST
      ROS_STATIC_PEERS: 127.0.0.1
      FASTRTPS_DEFAULT_PROFILES_FILE: /opt/ubts/sim/ubts/fastdds.xml
      ROVER_CONTROL_SOCKET: /run/ubts-steer/control.sock
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONPATH: /opt/ubts/raydeps:/opt/ubts/dashboard:/opt/ubts/sim/ubts:/opt/ubts/tools
      UBTS_STEER_CLOCK: ${UBTS_STEER_CLOCK:-wall}
      # the stack's executor starts with the row-following controller: the dashboard's one-press start and
      # sim_auto.py go through the operator page, which cannot choose a controller (the checks set theirs through the
      # SIM hook 'controller'; exec_run start sets row_follow the same way). UBTS_STEER_EXEC_CONTROLLER overrides it.
      UBTS_STEER_EXEC_CONTROLLER: '${UBTS_STEER_EXEC_CONTROLLER:-{"kind": "row_follow"}}'
      UBTS_STEER_EXEC_OVERRIDES: ${UBTS_STEER_EXEC_OVERRIDES:-}
      UBTS_STEER_EXEC_SKIP_SOURCE_CHECK: ${UBTS_STEER_EXEC_SKIP_SOURCE_CHECK:-0}
      # the stage 5 input diagnostics of the SIM clock mode (SpinMonitor, tick diag, input_gap): 1 turns them on
      UBTS_STEER_EXEC_INPUT_DIAG: ${UBTS_STEER_EXEC_INPUT_DIAG:-0}
      UBTS_STEER_SOURCE_COMMIT: ${UBTS_STEER_SOURCE_COMMIT:-unknown}
      UBTS_STEER_SOURCE_STATUS_SHA256: ${UBTS_STEER_SOURCE_STATUS_SHA256:-unknown}
    volumes:
      - control:/run/ubts-steer
    mem_limit: 512m
    cpus: 3                 # was 1.5 (throttled; dense-scan processing; STACK_OPERATIONS_KO.md 8)
    # CPU weight above the other services (no cpu_shares: cgroup v2 cpu.weight 100) when the VM's CPUs are contended;
    # the quota (cpus) is unchanged. 8192 shares = cpu.weight 532 in the container (read on Docker 29.9, the runc
    # mapping where 1024 shares = 100). STACK_OPERATIONS_KO.md 10
    cpu_shares: 8192
    stop_grace_period: 20s
    restart: "no"
  # Checks and scripted clients (profile check, not started by "up"): docker compose ... run --rm check <command>.
  # It joins the sim network and IPC (ROS graph, FastDDS shared memory), the control socket and the emulator hooks.
  check:
    image: ${UBTS_STEER_IMAGE:-ubts-steer-sim:wf9}
    profiles: ["check"]
    init: true
    network_mode: "service:sim"
    ipc: "service:sim"
    working_dir: /opt/ubts/sim/ubts
    command: ["python3", "-B", "-m", "steering.verify_steer", "--out", "/runs/verify"]
    environment:
      <<: *environment
    volumes:
      - runtime:/runtime
      - control:/run/ubts-steer
      - hooks:/run/ubts-steer-emu
      - type: bind
        source: ${UBTS_STEER_RUNS_DIR:-/nonexistent-ubts-steer-runs}
        target: /runs
        bind:
          create_host_path: false
    mem_limit: 512m
    cpus: 1
    stop_grace_period: 20s
    restart: "no"
volumes:
  runtime:
  control:
  cache:
  hooks:
