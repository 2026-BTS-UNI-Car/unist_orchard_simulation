# 앞바퀴 조향 차량 프로필 v0.1.1 (자리값)
#
# - v0.1(front_steer_v0_1_placeholder.yaml)에서 driver_stuck_fault 하나만 바꿨다(2 deg -> 3 deg, v0.2·v0.3과 같은 값).
#   이유: 결정 R54, 합격 기준 개정 52(docs/steering/SIM_ACCEPTANCE_KO.md). v0.1 파일과 v0.1로 낸 결과는 그대로 둔다.
# - v0.1은 v0(front_steer_v0_placeholder.yaml)에서 drive_tau_stall_nm 하나만 바꾼 판이다. 이유는 그 칸의 note와
#   docs/steering/DECISIONS_KO.md에 있다. v0 파일과 v0로 낸 결과는 그대로 둔다.
#
# 설계: docs/steering/DESIGN_v1_KO.md 3.8 / 결정: docs/steering/DECISIONS_KO.md
# 읽기·검사: sim/ubts/steering/vehicle_profile.py (schema ubts.vehicle_profile.v2)
#
# - 이 파일은 버전 파일이다. 실측이 오면 고치지 않고 새 파일을 만든다
#   (예: front_steer_v1_measured_<YYYYMMDD>.yaml).
# - 조향 사양은 아직 없다. 조향 값은 모두 자리값과 스윕 범위다.
#   이 프로필로 만든 결과는 "자리값 기반 SIM 결과"다. 현장 검증이 아니다.
# - DERIVED 값은 파일에 적지 않는다(설계 3.8.1). 읽을 때 계산한다. 값을 적으면 읽기를 거부한다.
#   계산값은 load_profile().provenance_table() 또는 value(이름)으로 본다.
#   DERIVED의 range는 입력 범위 전체에서 나오는 값을 덮는다(입력 범위 안 스윕이 막히지 않게).
# - stale_after_mod: true 는 조향 개조 전에 얻은 값이다.
# - range 형식: [lo, hi] 숫자 구간 / {choices: [...]} 허용 값 / {key: 범위} 키별 / [범위, ...] 원소별.
# - note의 "(새 자리값)"은 설계 표에 숫자(값 또는 범위)가 없어 이 파일에서 새로 정한 값이다.
#   목록은 docs/steering/VEHICLE_SPEC_REQUEST_KO.md 3.1절에도 있다.
# - 함께 스윕해야 하는 짝: 정지 중 조향 속도 <= 주행 중, 정지 중 최소 PWM >= 주행 중(읽기에서 검사한다).
schema: ubts.vehicle_profile.v2
profile_id: front_steer_v0_1_1_placeholder
