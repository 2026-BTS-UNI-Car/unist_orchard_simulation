    range: [20.0, 35.0]
    unit: deg
    provenance: MEASURED_20261116
    identify: [B2, B3]
    stale_after_mod: false
    note: '바퀴별·방향별 기계 한계(바퀴 각). Gazebo 관절 limit와 공유 모델이 같은 값을 쓴다 | 사양 반영: Q2 측정'
    source: Q2 (측정) 조향이 좌우 최대 약 20 도까지 돌고 그 이상 안 간다(사용자 확인). 어느 바퀴·등가각인지 구별이 없어 네 방향 모두 바퀴각 20 도로 둔다
  steer_soft_margin_deg:
