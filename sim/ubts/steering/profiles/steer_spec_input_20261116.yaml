# 조향 장치 사양 입력 2026-11-16 (실제 치수와 새 조향 보드). 빈 판은 steer_spec_input.yaml 이다.
#
# 근거(레포 밖 기록, 2026-11-16):
#   - 사용자 측정(줄자): 바퀴 지름 26 cm, 두께 9.5 cm, 휠베이스 65.7 cm, 바퀴 바깥-바깥 62.2 cm, LiDAR 꼭대기 57 cm,
#     LiDAR 는 앞차축에서 21 cm 뒤·좌우 가운데, 조향은 좌우 최대 약 20 도(그 이상 안 감), 0 도에도 축 유격으로 좌우 오차가 조금 있다.
#   - 새 보드 펌웨어 ABS-HOLD-8-REBOUND-LIMITS(BTS7960_Serial_Control.ino)와 보드 시험 기록(verification_quiet_full.log,
#     measurement_serial.log, rebound_serial.log). 펌웨어 상수와 보정 값은 apply_spec.py 의 ABS_HOLD_FW 에 있다.
# 명령(저장소 맨 위에서):
#   python -B tools/steer_sim/apply_spec.py --spec sim/ubts/steering/profiles/steer_spec_input_20261116.yaml --out <저장소 밖>
schema: ubts.steer_spec_input.v1
base_profile: front_steer_v0_3_placeholder
new_profile_id: front_steer_v1_spec_20261116
description: "실제 치수(2026-11-16 측정)와 새 조향 보드 펌웨어 ABS-HOLD-8 의 펄스 유지(SIM ESP 에뮬레이터 abs_hold_8)를 넣은 판. 나머지 조향 사양(킹핀 폭, Ackermann, 유격, 발자국 길이, 질량, IMU 자세, 가변저항 전기 범위 등)은 자리값이다. 결과는 자리값 기반 SIM 결과로 적는다."
base_origin: footprint_centre_symmetric_axles
steer_firmware:
  mode: abs_hold_8
  step_time_measured_s:
    value: {outward_20: 3.5, return_20: 2.5}
    source: 측정
    date: 20261116
    note: "verification_quiet_full.log(보드 시험, 차는 서 있음, 명령 눈금): 0 -> -20 마지막 긴 펄스까지 3.34 s(허용 10 count 안까지 약 3.7 s), 0 -> +20 약 3.6 s(끝에서 되튐 12~18 count, 허용 안까지 약 4.4 s), +20 -> 0 2.17 s, -20 -> 0 2.90 s. outward_20 은 앞의 둘(3.34, 3.6)의 평균, return_20 은 뒤의 둘의 평균"
fields:
  wheelbase_m:              {q: Q2,  value: 0.657, source: 측정, date: 20261116, note: "앞뒤 축 간격 65.7 cm(사용자 측정)"}
  track_front_m:            {q: Q2,  value: 0.527, source: 측정, date: 20261116, note: "좌우 바퀴 바깥-바깥 62.2 cm - 바퀴 두께 9.5 cm = 바퀴 중심 사이 52.7 cm(앞뒤 구별 없이 준 값)"}
  track_rear_m:             {q: Q2,  value: 0.527, source: 측정, date: 20261116, note: "앞 윤거와 같은 측정(앞뒤 구별 없이 준 값)"}
  kingpin_width_m:          {q: Q2,  value: null, source: null, date: null, note: null}
  wheel_radius_front_m:     {q: Q2,  value: 0.13, source: 측정, date: 20261116, note: "바퀴 지름 26 cm"}
  wheel_radius_rear_m:      {q: Q2,  value: 0.13, source: 측정, date: 20261116, note: "바퀴 지름 26 cm(네 바퀴 같음)"}
  steer_type:               {q: Q10, value: null, source: null, date: null, note: null}
