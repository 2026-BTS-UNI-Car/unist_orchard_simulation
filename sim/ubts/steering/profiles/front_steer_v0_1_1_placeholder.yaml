    note: "(윤거 - 킹핀 폭)/2 - 바퀴 반경 x tan(킹핀 경사). linkage 형식에서만 뜻이 있다. 자리값에서 0.05. 범위는 입력 범위 전체가 주는 -0.084~0.125를 덮는다(설계 표 0~0.10은 킹핀 폭 0.58~0.60 m를 막아서 넓혔다. 음수는 킹핀 축이 바퀴 중심보다 바깥)"}
  steer_hardware_margin_m: {value: 0.02, range: [0.0, 0.10], unit: "m", provenance: SPEC_PENDING, identify: [B1], stale_after_mod: false,
