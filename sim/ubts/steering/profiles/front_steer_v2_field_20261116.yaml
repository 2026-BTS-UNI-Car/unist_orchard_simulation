# 조향 차량 프로필 front_steer_v2_field_20261116 (2026-11-17, 작업 sim-smooth-model)
# 바탕: front_steer_v1_spec_20261116 의 바이트 그대로에 아래만 바꿨다(시험 test_steering_smooth_hold.py test_v2_differs_from_v1_only_in_these_records 가 확인).
#   schema v5, profile_id, description, servo_hz 1000, steer_fw_mode smooth_r5, abs_hold_fw 의 보정(보드 NVS CAL 1475/2017/2513), steer_step_time_measured_s 의 note,
#   새 L 묶음(smooth_fw, smooth_host, smooth_adc_sim, smooth_step_time_measured_s), 조향 모터 속도 맞춤(steer_rate_max_deg_s, steer_rate_standstill_deg_s).
# 출처: 현장 기록 sim/ubts/steering/field_records/field_steer_20261116_2321.yaml(바퀴 든 정지 상태, SMOOTH 펌웨어 r5)과 r5 소스(레포 밖 기록 runs/steer_smooth_20261116/fw/build_r5/source_r5.ino).
# 이 파일은 버전 파일이다. 고치지 말고 새 판을 만든다.
schema: ubts.vehicle_profile.v5
profile_id: front_steer_v2_field_20261116
description: 실제 치수(2026-11-16 측정)와 차량 조향 보드의 SMOOTH 펌웨어 r5(2026-11-16 밤, SM MODE=SMOOTH, 보정 1475/2017/2513)를 넣은 판. SIM ESP 에뮬레이터가 SMOOTH 유지(smooth_r5)를 돈다.
  조향 모터·가변저항·차체의 나머지 값은 v1 과 같은 자리값이다. 결과는 자리값 기반 SIM 결과로 적는다.
parameters:
  wheelbase_m:
    value: 0.657
    range: [0.65, 0.9]
    unit: m
    provenance: MEASURED_20261116
    identify: [B1]
    stale_after_mod: false
    note: '뒤차축-앞차축(axle_pivot이면 회전 중심) 거리. 기존 SIM 가정값 | 사양 반영: Q2 측정'
    source: Q2 (측정) 앞뒤 축 간격 65.7 cm(사용자 측정)
  track_front_m:
    value: 0.527
    range: [0.5, 0.65]
    unit: m
    provenance: MEASURED_20261116
    identify: [B1]
    stale_after_mod: false
    source: Q2 (측정) 좌우 바퀴 바깥-바깥 62.2 cm - 바퀴 두께 9.5 cm = 바퀴 중심 사이 52.7 cm(앞뒤 구별 없이 준 값)
    note: '사양 반영: Q2 측정'
  track_rear_m:
    value: 0.527
    range: [0.5, 0.65]
    unit: m
    provenance: MEASURED_20261116
    identify: [B1]
    stale_after_mod: false
    source: Q2 (측정) 앞 윤거와 같은 측정(앞뒤 구별 없이 준 값)
    note: '사양 반영: Q2 측정'
  kingpin_width_m:
    value: 0.46
    range: [0.4, 0.6]
    unit: m
