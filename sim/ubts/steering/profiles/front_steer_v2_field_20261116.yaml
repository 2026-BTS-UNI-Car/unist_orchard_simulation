  steer_ackermann_ratio:
    value: 0.5
    range: [0.0, 1.0]
    unit: '-'
    provenance: SPEC_PENDING
    identify: [B3]
    stale_after_mod: false
    note: 0 평행, 1 이상 Ackermann
  steer_mech_limit_deg:
