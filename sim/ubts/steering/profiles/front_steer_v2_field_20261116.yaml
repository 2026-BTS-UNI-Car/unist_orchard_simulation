    note: '차가 서 있을 때 조향 속도 상한. 주행 중 값 이하 | 사양 반영: Q11 추정'
    source: 'Q11 (추정) SMOOTH 펌웨어 r5 의 바퀴 든 계단 8개(현장 기록 field_steer_20261116_2321 step_response, PWM_MAX 80)에 맞춤: T1 정지
      계단을 같은 순서(0 -> 왼쪽 -> 오른쪽 -> 왼쪽 -> 0 -> 오른쪽 10 -> 0 -> 왼쪽 10 -> 0, 20 대신 소프트 한계 약 18 명령도)로 돌려 첫 연속 구동 시간을 명령도당으로
      현장 값과 견줌. L1 식 w = rate (u - min) / (1 - min) 의 rate 60/70/75/80/90/100 가운데 80 이 가장 가까움(평균 -4 %, rms 12 %; 시작 PWM
      10 % 는 그대로 둔 가정). 바퀴 든 상태라 땅에 닿은 조향·주행 중 값이 아니다. 맞춤 기록은 레포 밖 runs/sim_smooth_model_20261117/probe'
  steer_motor_tau_s:
