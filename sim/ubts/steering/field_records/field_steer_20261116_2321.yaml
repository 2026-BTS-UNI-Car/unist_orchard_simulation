      왼쪽 20 x 496 / 526 = 18.86, 평균 약 18.9 도. 각도계로 재지 않음(B3). 왼쪽 끝을 60 ms 스캔의 2551 로 보면 왼쪽 18.58. 20 도가 바퀴각이면(프로필
      steer_mech_limit_deg 의 해석, Ackermann 0.5 는 SPEC_PENDING) 등가각 끝은 18.83 도라 이 값은 약 17.8 도가 된다
