    range: [0.1, 0.16]
    unit: m
    provenance: MEASURED_20261116
    identify: [B1]
    stale_after_mod: false
    source: Q2 (측정) 바퀴 지름 26 cm
    note: '사양 반영: Q2 측정'
  wheel_radius_rear_m:
    value: 0.13
    range: [0.1, 0.16]
    unit: m
    provenance: MEASURED_20261116
    identify: [B1]
    stale_after_mod: false
    source: Q2 (측정) 바퀴 지름 26 cm(네 바퀴 같음)
    note: '사양 반영: Q2 측정'
  wheel_width_m:
    value: 0.095
    range: [0.08, 0.16]
    unit: m
    provenance: MEASURED_20261116
    identify: [B1]
    stale_after_mod: false
    source: Q2 (측정) 바퀴 두께 9.5 cm
    note: '사양 반영: Q2 측정'
  rear_axle_x_in_base_m:
    value: -0.3285
    range: [-0.5, -0.25]
    unit: m
    provenance: DEFINITION
    identify: [B1]
    stale_after_mod: false
    note: 'base(발자국 중심)에서 뒤차축 중심까지 x | 사양 반영: Q2 규약'
    source: 'Q2 (규약) SIM 규약: base 원점 = 발자국 가운데, 두 차축이 원점에 대칭(실측 아님). 뒤차축 x = -휠베이스 / 2'
  footprint_length_m:
