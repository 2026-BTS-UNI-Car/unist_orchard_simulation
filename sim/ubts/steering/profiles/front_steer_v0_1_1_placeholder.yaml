  caster_deg: {value: 0.0, range: [0.0, 10.0], unit: "deg", provenance: SPEC_PENDING, identify: [B1], stale_after_mod: false}
  kingpin_inclination_deg: {value: 0.0, range: [0.0, 12.0], unit: "deg", provenance: SPEC_PENDING, identify: [B1], stale_after_mod: false}
  scrub_radius_m: {range: [-0.09, 0.13], unit: "m", provenance: DERIVED,
