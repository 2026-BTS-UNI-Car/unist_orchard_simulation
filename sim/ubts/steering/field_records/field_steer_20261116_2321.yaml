      안, 취소 0. 첫 움직임(0 -> +20)은 정지에서 시작. 달리는 동안 조용한 읽기 값의 10 ms 변화 최대 20 count(946 쌍), 원값과 조용한 읽기의 차가 40 count
      넘은 표본 19 / 954(2.0 %). 바퀴 든 정지 상태라 땅에 닿은 조향이나 주행 중 조향 속도가 아니다
