    identify: [B1]
    stale_after_mod: false
  cog_z_m:
    value: 0.32
    range: [0.2, 0.45]
    unit: m
    provenance: SIM_ASSUMED
    identify: [B1]
    stale_after_mod: false
  wheel_mass_kg:
    value: 1.5
    range: [1.0, 3.0]
    unit: kg
    provenance: SIM_ASSUMED
    identify: [part]
    stale_after_mod: false
  wheel_inertia_kgm2:
    unit: kg*m^2
    provenance: DERIVED
    derived_from: [wheel_mass_kg, wheel_radius_front_m, wheel_radius_rear_m, drive_wheels]
    identify: [part]
    note: 속이 찬 원판 가정 J = m r^2 / 2. r은 구동 바퀴 반경(front2면 앞바퀴, 아니면 뒷바퀴. G-SIM DC 직선과 같은 바퀴). G-SIM 안정 조건용. 자리값에서 0.0147
  steer_link_mass_kg:
